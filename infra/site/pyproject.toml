[project]
name = "cyber-berezka-site"
version = "0.1.0"
description = "Cyber Berezka — landing + cabinet"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "redis[hiredis]>=5.2",
    "qrcode[pil]>=7.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
